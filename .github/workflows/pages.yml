name: Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy specimen site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate specimen glyph blocks (#9)
        run: python scripts/gen_specimen.py

      - name: Stage site
        run: |
          mkdir site
          cp -r specimen site/specimen
          cp -r releases site/releases
          cp index.html about.html try.html poster.html print.html site/ 2>/dev/null || true
          cp favicon-32.png favicon-512.png favicon.ico apple-touch-icon.png site/
          cp -r docs site/docs 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
