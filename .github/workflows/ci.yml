name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python src/newell/test_generator.py

      - name: Legibility manifest check (#11)
        run: python scripts/gen_manifest.py --check

      - name: Specimen freshness check (#9)
        run: python scripts/gen_specimen.py --check

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            sources/Newell-Regular.ufo
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build fonts
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build fonts
        run: python scripts/build_all.py

      - name: Verify binaries exist
        run: |
          set -e
          for f in releases/Newell-Regular.otf releases/Newell-Regular.ttf                    releases/Newell-Regular.woff2 'releases/Newell[wght].ttf'                    releases/Newell-Light.ttf releases/Newell-Bold.ttf                    releases/Newell-Black.ttf; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f missing or empty" >&2
              exit 1
            fi
            echo "ok: $f ($(stat -c%s "$f") bytes)"
          done
          SIZE=$(stat -c%s "releases/Newell-Regular.woff2")
          if [ "$SIZE" -ge 30720 ]; then
            echo "ERROR: woff2 $SIZE bytes >= 30KB limit (#10)" >&2
            exit 1
          fi
          echo "ok: woff2 size gate ($SIZE bytes < 30KB)"

      - name: Upload font binaries
        uses: actions/upload-artifact@v4
        with:
          name: newell-fonts
          path: |
            releases/Newell-Regular.otf
            releases/Newell-Regular.ttf
            releases/Newell-Regular.woff2
            releases/Newell[wght].ttf
            releases/Newell-Light.ttf
            releases/Newell-Bold.ttf
            releases/Newell-Black.ttf
          if-no-files-found: error
          retention-days: 14
