name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python src/newell/test_generator.py

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            sources/Newell-Regular.ufo
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build fonts
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build fonts
        run: python scripts/build_all.py

      - name: Verify binaries exist
        run: |
          set -e
          for fmt in otf ttf woff2; do
            f="releases/Newell-Regular.${fmt}"
            if [ ! -s "$f" ]; then
              echo "ERROR: $f missing or empty" >&2
              exit 1
            fi
            echo "ok: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Upload font binaries
        uses: actions/upload-artifact@v4
        with:
          name: newell-fonts
          path: |
            releases/Newell-Regular.otf
            releases/Newell-Regular.ttf
            releases/Newell-Regular.woff2
          if-no-files-found: error
          retention-days: 14
